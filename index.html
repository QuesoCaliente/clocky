<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj 24hrs</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        html {
            font-size: 12pt;
            font-family: monospace;
        }

        #reloj, p {
            font-size: 8rem;
            color: #E5E5E5;
            font-weight: 700;
            letter-spacing: 4%;
            -webkit-text-stroke: 12px #000;
            paint-order: stroke fill;
        }

        .container {
            display: flex;
            gap: 1.5rem;
            justify-content: end;
            align-items: center;
        }

        #reloj {
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <span id="reloj"></span>
        <p id="text">🐭</p>
    </div>
    <script>
            
        function obtenerZonaHoraria(pais) {
            const zonasHorarias = {
                "Argentina": "America/Argentina/Buenos_Aires",
                "Bolivia": "America/La_Paz",
                "Brasil": "America/Sao_Paulo",
                "Chile": "America/Santiago",
                "Colombia": "America/Bogota",
                "CostaRica": "America/Costa_Rica",
                "Cuba": "America/Havana",
                "Ecuador": "America/Guayaquil",
                "ElSalvador": "America/El_Salvador",
                "Guatemala": "America/Guatemala",
                "Honduras": "America/Tegucigalpa",
                "Mexico": "America/Mexico_City",
                "Nicaragua": "America/Managua",
                "Panama": "America/Panama",
                "Paraguay": "America/Asuncion",
                "Peru": "America/Lima",
                "RepublicaDominicana": "America/Santo_Domingo",
                "Uruguay": "America/Montevideo",
                "Venezuela": "America/Caracas",
            };
            return zonasHorarias[pais] || null; // Devuelve null si el país no está en la lista
        }
        function actualizarReloj(zonaHoraria) {
            const ahora = new Date();
            const opciones = { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" };
            if (zonaHoraria) opciones.timeZone = zonaHoraria; // Usar zona horaria si está disponible
            const horaFormateada = new Intl.DateTimeFormat("en-US", opciones).format(ahora);
            document.getElementById('reloj').textContent = horaFormateada;
        }

        // Obtener parámetros de la URL
        const params = new URLSearchParams(window.location.search);
        const pais = params.get("pais");
        const zonaHoraria = obtenerZonaHoraria(pais);

        // Cambiar el emoji
        const text = document.getElementById("text");
        text.textContent = params.get("text") || "🐭";

        // Actualizar el reloj cada segundo
        setInterval(() => actualizarReloj(zonaHoraria), 1000);
        actualizarReloj(zonaHoraria);
    </script>
</body>
</html>
